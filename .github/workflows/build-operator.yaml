name: Publish Streaming Operator

on:
  push:
    branches:
      - main
    paths:
      - sentry_streams_k8s/**
      - .github/workflows/build-operator.yaml

jobs:
  build-and-push:
    name: Build and push image to ${{ matrix.registry }} Google Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - registry: single-region
            image: us-central1-docker.pkg.dev/sentryio/streaming-operator/image
          - registry: multi-region
            image: us-docker.pkg.dev/sentryio/streaming-operator-mr/image
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: getsentry/action-build-and-push-images@4852d671d747d7c0268b2a3fc429fee9d4a16f78
        with:
          image_name: 'streaming-operator'
          platforms: linux/amd64
          dockerfile_path: './sentry_streams_k8s/Dockerfile'
          build_context: './sentry_streams_k8s'
          ghcr: false
          tag_nightly: false
          google_ar: true
          google_ar_image_name: ${{ matrix.image }}
          google_workload_identity_provider: projects/868781662168/locations/global/workloadIdentityPools/prod-github/providers/github-oidc-pool
          google_service_account: gha-gcr-push@sac-prod-sa.iam.gserviceaccount.com

  publish-chart:
    name: Publish Helm chart
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CHART_DIR: sentry_streams_k8s/chart/streaming-operator
      CHART_OCI_REPO: oci://us-central1-docker.pkg.dev/sentryio/streaming-operator
      CHART_VERSION: 0.0.0-${{ github.sha }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/868781662168/locations/global/workloadIdentityPools/prod-github/providers/github-oidc-pool
          service_account: gha-gcr-push@sac-prod-sa.iam.gserviceaccount.com

      - name: Lint chart
        run: |
          helm lint "${CHART_DIR}"
          helm template streaming-operator "${CHART_DIR}" \
            --set-string image.tag="${IMAGE_TAG}" > /dev/null

      - name: Push chart
        run: |
          gcloud auth print-access-token \
            | helm registry login us-central1-docker.pkg.dev \
                --username oauth2accesstoken \
                --password-stdin
          helm package "${CHART_DIR}" \
            --destination /tmp/chart-dist \
            --version "${CHART_VERSION}" \
            --app-version "${IMAGE_TAG}"
          helm push \
            "/tmp/chart-dist/streaming-operator-${CHART_VERSION}.tgz" \
            "${CHART_OCI_REPO}"
