name: Publish Streaming Operator Release (image + helm chart)

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: publish-operator-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: us-central1-docker.pkg.dev/sentryio/streaming-operator/image
  IMAGE_MR: us-docker.pkg.dev/sentryio/streaming-operator-mr/image
  CHART_OCI_REPO: oci://us-central1-docker.pkg.dev/sentryio/streaming-operator
  CHART_DIR: sentry_streams_k8s/chart/streaming-operator

jobs:
  publish:
    name: Publish versioned image and chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve version and check the tag is a sentry-streams-k8s release
        id: vars
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('sentry_streams_k8s/pyproject.toml','rb'))['project']['version'])")
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${VERSION}" ]]; then
            echo "::notice::Tag ${GITHUB_REF_NAME} != sentry-streams-k8s version ${VERSION} (most likely a sentry_streams release) — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHART_VERSION=$(awk '/^version:/ {print $2}' "${CHART_DIR}/Chart.yaml")
          if [[ "${CHART_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Chart.yaml version (${CHART_VERSION}) != package version (${VERSION}); scripts/bump-version.sh should keep them equal."
            exit 1
          fi
          APP_VERSION=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' "${CHART_DIR}/Chart.yaml")
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: GCP auth
        if: steps.vars.outputs.publish == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/868781662168/locations/global/workloadIdentityPools/prod-github/providers/github-oidc-pool"
          service_account: "gha-gcr-push@sac-prod-sa.iam.gserviceaccount.com"

      - name: Set up gcloud
        if: steps.vars.outputs.publish == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        if: steps.vars.outputs.publish == 'true'
        run: gcloud --quiet auth configure-docker us-central1-docker.pkg.dev,us-docker.pkg.dev

      - name: Set up Docker Buildx
        if: steps.vars.outputs.publish == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push versioned operator image
        if: steps.vars.outputs.publish == 'true'
        env:
          APP_VERSION: ${{ steps.vars.outputs.app_version }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file sentry_streams_k8s/Dockerfile \
            --tag "${IMAGE}:${APP_VERSION}" \
            --tag "${IMAGE_MR}:${APP_VERSION}" \
            --push \
            sentry_streams_k8s

      - name: Lint chart
        if: steps.vars.outputs.publish == 'true'
        run: |
          helm lint "${CHART_DIR}"
          helm template streaming-operator "${CHART_DIR}" > /dev/null

      - name: Push chart
        if: steps.vars.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          gcloud auth print-access-token \
            | helm registry login us-central1-docker.pkg.dev -u oauth2accesstoken --password-stdin
          helm package "${CHART_DIR}" --destination /tmp/chart-dist
          helm push "/tmp/chart-dist/streaming-operator-${VERSION}.tgz" "${CHART_OCI_REPO}"
