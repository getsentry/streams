[package]
name = "rust_streams"
version = "0.1.0"
edition = "2021"

[dependencies]
pyo3 = { version = "0.29.0" }
serde = { version = "1.0", features = ["derive"] }
sentry_arroyo = { version = "2.47.0", features = ["ssl"] }
chrono = "0.4.40"
tracing = "0.1.40"
tracing-subscriber = "0.3.20"
ctrlc = "3.4.6"
rdkafka = { version = "0.37.0", features = ["cmake-build", "tracing"] }
anyhow = "1.0.98"
bytes = "1.11.1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset"] }
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread"] }
log = "0.4.27"
serde_json = "1.0.141"
clap = { version = "4.5.45", features = ["derive"], optional = true }
gcp_auth = "0.12.2"
metrics = "0.24.0"
metrics-exporter-dogstatsd = "0.9.0"
rand = "0.9"
sentry = { version = "0.48.1", default-features = false, features = [
    # Default features, but `reqwest` instead of `transport`: sentry's `native-tls`
    # feature pulls ureq + webpki-root-certs into Cargo.lock. TLS comes from the
    # `native-tls` feature on our own reqwest dependency below.
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "release-health",
    "reqwest",
] }

[lib]
name = "rust_streams"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gcs-upload-test"
path = "src/bin/gcs-upload-test.rs"

[features]
extension-module = ["pyo3/extension-module"]
cli = ["dep:clap", "pyo3/auto-initialize"]

[dev-dependencies]
parking_lot = "0.12.1"
pyo3 = { version = "*", features = ["auto-initialize"] }
